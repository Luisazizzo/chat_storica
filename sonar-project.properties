# SonarQube / SonarLint - Esclusioni
# Non analizzare codice di terze parti o generato

# Ambienti virtuali e dipendenze
sonar.exclusions=\
  **/.venv/**,\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  **/dist/**,\
  **/build/**

# Coverage
sonar.coverage.exclusions=\
  **/.venv/**,\
  **/node_modules/**
